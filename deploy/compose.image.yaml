# Runs a ready image behind Caddy, without the source code. Copy this file to the
# NAS as docker-compose.yml. Relative paths are relative to its folder. See
# "Running from an image" in docs/deployment.md.
name: fuchsia-photos

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: photos
      POSTGRES_DB: photos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=4GB"]
    volumes:
      - ${POSTGRES_DIR:-./data/postgres}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photos -d photos"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    # Published by CI on every push to master. IMAGE_TAG selects a sha-<commit> tag instead.
    image: ghcr.io/denuser/fuchsia-photos:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://photos:${POSTGRES_PASSWORD}@postgres:5432/photos
      WORKERS: ${WORKERS:-3}
      IMPORT_STABLE_SECONDS: ${IMPORT_STABLE_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    # Only Caddy, on the host network, reaches the application.
    ports:
      - "127.0.0.1:10303:8080"
    # Docker keeps container logs forever unless told otherwise.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    volumes:
      - ${LIBRARY_DIR:-./data/library}:/data/library
      - ${CACHE_DIR:-./data/cache}:/data/cache
      - ${IMPORT_DIR:-./data/import}:/data/import:ro

  # Dumps the database every night and keeps the latest dumps. See "Backups" in
  # docs/deployment.md. $$ stands for $ in the script.
  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: photos
      PGDATABASE: photos
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      TZ: ${TZ:-UTC}
    volumes:
      - ${BACKUP_DIR:-./data/backups}:/backups
    entrypoint: [sh, -c]
    command:
      - |
        trap 'exit 0' TERM INT
        echo "backup: every day at $$BACKUP_TIME $$TZ, keeping $$BACKUP_KEEP dumps"
        while true; do
          now=$$(date +%s)
          next=$$(date -d "today $$BACKUP_TIME" +%s) || exit 1
          [ "$$next" -gt "$$now" ] || next=$$(date -d "tomorrow $$BACKUP_TIME" +%s)
          sleep $$((next - now)) & wait $$!
          name=photos-$$(date +%Y-%m-%d-%H%M).dump
          if pg_dump --format=custom --file=/backups/.partial; then
            mv /backups/.partial "/backups/$$name"
            echo "backup: wrote $$name, $$(du -h "/backups/$$name" | cut -f1)"
            ls -1 /backups/photos-*.dump | head -n -"$$BACKUP_KEEP" | xargs -r rm -v
          else
            echo "backup: pg_dump failed" >&2
            rm -f /backups/.partial
          fi
        done

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    # On the host network, Caddy sees which address of the NAS a client
    # connected to, and picks that address's certificate when the client sends
    # no server name, as clients that connect by IP address do.
    network_mode: host
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ${CADDY_DIR:-./data/caddy}:/data

# The Caddyfile is part of this file, so the NAS needs nothing else.
# SITE_ADDRESS lists the addresses of the NAS, separated by commas.
configs:
  caddyfile:
    content: |
      {
        https_port ${HTTPS_PORT:-10304}
        auto_https disable_redirects
        skip_install_trust
        admin off
      }

      ${SITE_ADDRESS:?set SITE_ADDRESS in .env} {
        tls internal
        encode zstd gzip
        reverse_proxy 127.0.0.1:10303
      }
