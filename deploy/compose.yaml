name: fuchsia-photos

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: photos
      POSTGRES_DB: photos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=4GB"]
    volumes:
      - ${POSTGRES_DIR:-./data/postgres}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photos -d photos"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: fuchsia-photos:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://photos:${POSTGRES_PASSWORD}@postgres:5432/photos
      WORKERS: ${WORKERS:-2}
      PREVIEW_FORMAT: ${PREVIEW_FORMAT:-webp}
      IMPORT_STABLE_SECONDS: ${IMPORT_STABLE_SECONDS:-60}
    volumes:
      - ${LIBRARY_DIR:-./data/library}:/data/library
      - ${CACHE_DIR:-./data/cache}:/data/cache
      - ${IMPORT_DIR:-./data/import}:/data/import:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
