name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag, such as `0.1.1` or `latest`, shown on the administration page.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it runs
      options:
        - Docker Compose
        - TrueNAS app
        - Other
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: The CPU, memory and architecture (amd64 or arm64) of the machine.
  - type: textarea
    id: files
    attributes:
      label: The photo, if one is involved
      description: The format and the camera or phone, for example "NEF from a Nikon Z6 III" or "HEIC from an iPhone 15". Do not attach private photos.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines of `docker compose logs app`.
      render: text
