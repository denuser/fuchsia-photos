openapi: 3.1.0
info:
  title: Fuchsia Photos API
  version: 0.4.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the application can serve requests
      security: []
      responses:
        "200":
          description: The application and its database are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /login:
    post:
      operationId: login
      summary: Start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Logged in. The session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
  /logout:
    post:
      operationId: logout
      summary: End the session
      security: []
      responses:
        "204":
          description: Logged out
  /me:
    get:
      operationId: getMe
      summary: Get the current user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Change the current user's settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sharedIncludesAlbums:
                  type: boolean
                viewerShowsOriginals:
                  type: boolean
                viewerHiddenFields:
                  type: array
                  items:
                    $ref: "#/components/schemas/ViewerField"
                navigationHiddenOnPhones:
                  type: boolean
      responses:
        "200":
          description: The changed user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
  /me/password:
    post:
      operationId: changePassword
      summary: Change the current user's password and end their other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        "204":
          description: The password is changed
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: List users (administrators only)
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create a user (administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password, role]
              properties:
                login:
                  type: string
                password:
                  type: string
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "201":
          description: The new user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /users/directory:
    get:
      operationId: listUserDirectory
      summary: List the logins of active users, to choose whom to share with
      responses:
        "200":
          description: Active users, by login
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRef"
  /users/{id}:
    patch:
      operationId: updateUser
      summary: Change a user (administrators only)
      description: Resetting a password or disabling a user ends their sessions. Administrators cannot change their own role or disable themselves.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/Role"
                disabled:
                  type: boolean
                password:
                  type: string
      responses:
        "200":
          description: The changed user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /photos:
    get:
      operationId: listPhotos
      summary: List the current user's photos, newest first
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: cursor
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: Only photos sorted at or after this time
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only photos sorted before this time
          schema:
            type: string
            format: date-time
        - name: tag
          in: query
          description: Only photos with at least one of these tags
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: camera
          in: query
          description: Only photos taken with one of these cameras, named as listCameras gives them
          schema:
            type: array
            items:
              type: string
        - name: lens
          in: query
          description: Only photos taken with one of these lenses, named as listCameras gives them
          schema:
            type: array
            items:
              type: string
        - name: album
          in: query
          description: Only photos of this album
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: One page of photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoPage"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: uploadPhoto
      summary: Upload a photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The user already had this photo, and nothing was added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "201":
          description: The photo was added and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /photos/trash:
    get:
      operationId: listTrash
      summary: List the current user's photos in the trash, most recently deleted first
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: One page of photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoPage"
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: trashPhotos
      summary: Move photos to the trash
      description: Photos stay in the trash until the owner restores or purges them. Photos of other users are ignored.
      requestBody:
        $ref: "#/components/requestBodies/PhotoIds"
      responses:
        "204":
          description: The photos are in the trash
        "400":
          $ref: "#/components/responses/Error"
  /photos/trash/empty:
    post:
      operationId: emptyTrash
      summary: Permanently delete every photo in the current user's trash
      responses:
        "204":
          description: The trash is empty
  /photos/restore:
    post:
      operationId: restorePhotos
      summary: Take photos out of the trash
      requestBody:
        $ref: "#/components/requestBodies/PhotoIds"
      responses:
        "204":
          description: The photos are restored
        "400":
          $ref: "#/components/responses/Error"
  /photos/purge:
    post:
      operationId: purgePhotos
      summary: Permanently delete photos from the trash, with their files
      description: Photos outside the trash and photos of other users are ignored.
      requestBody:
        $ref: "#/components/requestBodies/PhotoIds"
      responses:
        "204":
          description: The photos are deleted
        "400":
          $ref: "#/components/responses/Error"
  /photos/tags:
    post:
      operationId: changePhotoTags
      summary: Add tags to photos and remove tags from them
      description: Photos and tags of other users are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  $ref: "#/components/schemas/PhotoIds"
                add:
                  type: array
                  items:
                    type: integer
                    format: int64
                remove:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "204":
          description: The tags are changed
        "400":
          $ref: "#/components/responses/Error"
  /photos/months:
    get:
      operationId: countPhotoMonths
      summary: Count the photos of listPhotos by month
      description: Takes the filters of listPhotos. The timeline lays out months it has not loaded yet from these counts.
      parameters:
        - name: tz
          in: query
          required: true
          description: The IANA time zone that months are counted in, such as `Europe/Moscow`
          schema:
            type: string
        - name: from
          in: query
          description: Only photos sorted at or after this time
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only photos sorted before this time
          schema:
            type: string
            format: date-time
        - name: tag
          in: query
          description: Only photos with at least one of these tags
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: camera
          in: query
          description: Only photos taken with one of these cameras, named as listCameras gives them
          schema:
            type: array
            items:
              type: string
        - name: lens
          in: query
          description: Only photos taken with one of these lenses, named as listCameras gives them
          schema:
            type: array
            items:
              type: string
        - name: album
          in: query
          description: Only photos of this album
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Photos by month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthCounts"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /photos/events:
    get:
      operationId: photoEvents
      summary: Stream changes to the current user's photos
      description: Server-sent events named `photos`, each holding a PhotoEvent as JSON. Changed photos include those moved to the trash, which have `deletedAt` set.
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/PhotoEvent"
  /photos/cameras:
    get:
      operationId: listCameras
      summary: List the cameras and lenses of the current user's photos
      description: For the camera and lens filters of listPhotos. Photos in the trash are left out
      responses:
        "200":
          description: Cameras and lenses by name, with the number of photos each took
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraLists"
  /photos/shared:
    get:
      operationId: listSharedPhotos
      summary: List other users' photos shared with the current user
      description: Photos shared by login or visible to all users. Photos of shared albums are included if the user's `sharedIncludesAlbums` setting is on.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: cursor
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: Only photos sorted at or after this time
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only photos sorted before this time
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of photos, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoPage"
        "400":
          $ref: "#/components/responses/Error"
  /photos/shared/months:
    get:
      operationId: countSharedMonths
      summary: Count the photos of listSharedPhotos by month
      parameters:
        - name: tz
          in: query
          required: true
          description: The IANA time zone that months are counted in, such as `Europe/Moscow`
          schema:
            type: string
      responses:
        "200":
          description: Photos by month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthCounts"
        "400":
          $ref: "#/components/responses/Error"
  /photos/all:
    get:
      operationId: listAllPhotos
      summary: List the photos of all users, outside the trash
      description: Administrators only.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: cursor
          in: query
          schema:
            type: string
        - name: owner
          in: query
          description: Only the photos of this user
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          description: Only photos sorted at or after this time
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only photos sorted before this time
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of photos, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoPage"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /photos/all/months:
    get:
      operationId: countAllMonths
      summary: Count the photos of listAllPhotos by month
      description: Administrators only.
      parameters:
        - name: tz
          in: query
          required: true
          description: The IANA time zone that months are counted in, such as `Europe/Moscow`
          schema:
            type: string
        - name: owner
          in: query
          description: Only the photos of this user
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Photos by month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthCounts"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /photos/sharing:
    post:
      operationId: changePhotoSharing
      summary: Change who can see photos
      description: Applies to photos of the current user, or to any photo for an administrator. Other ids are ignored, and so are the photos' owners and disabled users among those added. All changes apply or none does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SharingChange"
                - type: object
                  required: [ids]
                  properties:
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 500
                      items:
                        type: integer
                        format: int64
      responses:
        "204":
          description: The photos were changed
        "400":
          $ref: "#/components/responses/Error"
  /photos/{id}:
    get:
      operationId: getPhoto
      summary: Get a photo the current user may see
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "404":
          $ref: "#/components/responses/Error"
  /photos/{id}/tags:
    get:
      operationId: getPhotoTags
      summary: List the current user's own tags on a photo
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagRef"
        "404":
          $ref: "#/components/responses/Error"
  /photos/{id}/sharing:
    get:
      operationId: getPhotoSharing
      summary: Get who can see a photo
      description: For the owner and administrators.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The photo's sharing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sharing"
        "404":
          $ref: "#/components/responses/Error"
  /photos/{id}/previews/{kind}:
    get:
      operationId: getPreview
      summary: Get a preview without metadata
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [grid, viewer]
      responses:
        "200":
          description: The preview image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /photos/{id}/original:
    get:
      operationId: getOriginal
      summary: Download the original file
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The original file
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /albums:
    get:
      operationId: listAlbums
      summary: List the current user's albums
      responses:
        "200":
          description: The albums, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Album"
    post:
      operationId: createAlbum
      summary: Create an album
      requestBody:
        $ref: "#/components/requestBodies/Name"
      responses:
        "201":
          description: The new album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "400":
          $ref: "#/components/responses/Error"
  /albums/shared:
    get:
      operationId: listSharedAlbums
      summary: List other users' albums shared with the current user
      responses:
        "200":
          description: Shared albums, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Album"
  /albums/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAlbum
      summary: Get an album
      responses:
        "200":
          description: The album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: renameAlbum
      summary: Rename an album
      requestBody:
        $ref: "#/components/requestBodies/Name"
      responses:
        "200":
          description: The changed album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAlbum
      summary: Delete an album and keep its photos
      responses:
        "204":
          description: The album is deleted
        "404":
          $ref: "#/components/responses/Error"
  /albums/{id}/cover:
    put:
      operationId: setAlbumCover
      summary: Choose the cover of an album
      description: The photo must be in the album and not in the trash. With null, the newest photo becomes the cover again.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoId]
              properties:
                photoId:
                  type: [integer, "null"]
                  format: int64
      responses:
        "200":
          description: The changed album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "404":
          $ref: "#/components/responses/Error"
  /albums/{id}/sharing:
    get:
      operationId: getAlbumSharing
      summary: Get who can see an album
      description: For the album's owner.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The album's sharing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sharing"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: changeAlbumSharing
      summary: Change who can see an album and its photos
      description: For the album's owner. The album's owner and disabled users among those added are ignored. All changes apply or none does.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharingChange"
      responses:
        "204":
          description: The album was changed
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /albums/{id}/photos:
    post:
      operationId: addAlbumPhotos
      summary: Add photos to an album
      description: Photos of other users and photos in the trash are ignored.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/PhotoIds"
      responses:
        "204":
          description: The photos are in the album
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /albums/{id}/photos/remove:
    post:
      operationId: removeAlbumPhotos
      summary: Remove photos from an album and keep them in the library
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/PhotoIds"
      responses:
        "204":
          description: The photos are out of the album
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /tags:
    get:
      operationId: listTags
      summary: List the current user's tags
      responses:
        "200":
          description: The tags, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
    post:
      operationId: createTag
      summary: Create a tag, or find the existing one with this name
      description: Names are compared without regard to case.
      requestBody:
        $ref: "#/components/requestBodies/Name"
      responses:
        "200":
          description: The user already had this tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRef"
        "201":
          description: The new tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRef"
        "400":
          $ref: "#/components/responses/Error"
  /tags/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: renameTag
      summary: Rename a tag
      requestBody:
        $ref: "#/components/requestBodies/Name"
      responses:
        "200":
          description: The changed tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRef"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTag
      summary: Delete a tag and keep its photos
      responses:
        "204":
          description: The tag is deleted
        "404":
          $ref: "#/components/responses/Error"
  /imports:
    get:
      operationId: listImports
      summary: List recent folder scans, newest first (administrators only)
      responses:
        "200":
          description: Recent scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportRun"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: startImport
      summary: Start a scan of a folder for a user (administrators only)
      description: Only one scan runs at a time. The source folder is never changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerId, folder]
              properties:
                ownerId:
                  type: integer
                  format: int64
                folder:
                  description: A folder inside the import folder. Empty means all of it
                  type: string
      responses:
        "201":
          description: The new scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /imports/folders:
    get:
      operationId: listImportFolders
      summary: List the folders inside the import folder, three levels deep (administrators only)
      responses:
        "200":
          description: Relative paths of folders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "403":
          $ref: "#/components/responses/Error"
  /imports/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getImport
      summary: Get a scan with the files that had problems, up to 500 (administrators only)
      responses:
        "200":
          description: The scan
          content:
            application/json:
              schema:
                type: object
                required: [run, problems]
                properties:
                  run:
                    $ref: "#/components/schemas/ImportRun"
                  problems:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImportProblem"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /imports/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: stopImport
      summary: Stop a running scan. Photos already imported stay (administrators only)
      responses:
        "204":
          description: The scan stops after the files it is working on
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /settings/previews:
    get:
      operationId: getPreviewSettings
      summary: Settings for generating new previews (administrators only)
      responses:
        "200":
          description: The current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewSettings"
        "403":
          $ref: "#/components/responses/Error"
    put:
      operationId: updatePreviewSettings
      summary: Change the settings for new previews. Existing previews stay as they are (administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewSettings"
      responses:
        "200":
          description: The saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewSettings"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /settings/metadata:
    get:
      operationId: getMetadataSettings
      summary: Settings for the photo metadata the API returns (administrators only)
      responses:
        "200":
          description: The current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSettings"
        "403":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateMetadataSettings
      summary: Change the settings for photo metadata. They apply to every response from then on (administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataSettings"
      responses:
        "200":
          description: The saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSettings"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
security:
  - session: []
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fuchsia_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBodies:
    PhotoIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids:
                $ref: "#/components/schemas/PhotoIds"
    Name:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
  responses:
    Error:
      description: The request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    MetadataSettings:
      type: object
      required: [showLocation]
      properties:
        showLocation:
          description: Whether photos include where they were taken, for everyone who may see them
          type: boolean
    PreviewSettings:
      type: object
      required: [format, webpQuality, webpEffort, jpegQuality, gridEdge, viewerEdge]
      properties:
        format:
          type: string
          enum: [webp, jpeg]
        webpQuality:
          type: integer
          minimum: 1
          maximum: 100
        webpEffort:
          type: integer
          minimum: 0
          maximum: 6
        jpegQuality:
          type: integer
          minimum: 1
          maximum: 100
        gridEdge:
          type: integer
          minimum: 200
          maximum: 800
          description: Longest side of a grid preview, in pixels
        viewerEdge:
          type: integer
          minimum: 1024
          maximum: 4096
          description: Longest side of a viewer preview, in pixels
    ImportRun:
      type: object
      required: [id, ownerId, folder, status, error, found, added, duplicates, inTrash, purged, unsupported, changing, failed, createdAt, finishedAt]
      properties:
        id:
          type: integer
          format: int64
        ownerId:
          type: integer
          format: int64
        folder:
          type: string
        status:
          type: string
          enum: [listing, importing, finished, stopped, failed]
        error:
          type: [string, "null"]
        found:
          description: Files found in the folder
          type: integer
          format: int64
        added:
          description: New photos
          type: integer
          format: int64
        duplicates:
          description: Photos the owner already has
          type: integer
          format: int64
        inTrash:
          description: Photos in the owner's trash, which stay there
          type: integer
          format: int64
        purged:
          description: Photos the owner deleted permanently, which stay deleted
          type: integer
          format: int64
        unsupported:
          description: Files that are not supported photos
          type: integer
          format: int64
        changing:
          description: Files that changed during the scan, probably still being copied
          type: integer
          format: int64
        failed:
          description: Files that could not be imported
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
    ImportProblem:
      type: object
      required: [path, state, error]
      properties:
        path:
          type: string
        state:
          type: string
          enum: [changing, failed]
        error:
          type: [string, "null"]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Role:
      type: string
      enum: [admin, user]
    User:
      type: object
      required: [id, login, role, disabled, createdAt, sharedIncludesAlbums, viewerShowsOriginals, viewerHiddenFields, navigationHiddenOnPhones]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        sharedIncludesAlbums:
          description: Whether the user's list of shared photos includes the photos of shared albums
          type: boolean
        viewerShowsOriginals:
          description: Whether the viewer shows original files instead of viewer previews. Originals the browser cannot display, such as HEIC in most browsers, fall back to the preview
          type: boolean
        viewerHiddenFields:
          description: Photo details the viewer leaves out, in the viewer's order. The API still returns them
          type: array
          items:
            $ref: "#/components/schemas/ViewerField"
        navigationHiddenOnPhones:
          description: Whether the navigation drawer stays hidden on a phone until the menu button opens it. On by default
          type: boolean
    ViewerField:
      description: A photo detail the viewer can show. `camera` is the make and model, `location` is shown only if an administrator allows it
      type: string
      enum: [camera, lens, focalLength, aperture, exposureTime, iso, exposureCompensation, flash, location]
    UserRef:
      type: object
      required: [id, login]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
    Visibility:
      type: string
      enum: [private, all]
    Sharing:
      type: object
      required: [visibility, users]
      properties:
        visibility:
          $ref: "#/components/schemas/Visibility"
        users:
          description: The users it is shared with by login
          type: array
          items:
            $ref: "#/components/schemas/UserRef"
    SharingChange:
      description: Fields left out change nothing.
      type: object
      properties:
        visibility:
          $ref: "#/components/schemas/Visibility"
        add:
          description: Users to share with
          type: array
          items:
            type: integer
            format: int64
        remove:
          description: Users to stop sharing with
          type: array
          items:
            type: integer
            format: int64
    Photo:
      type: object
      required: [id, ownerId, status, name, mime, size, width, height, takenAt, sortAt, createdAt, deletedAt, camera, location]
      properties:
        id:
          type: integer
          format: int64
        ownerId:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, ready, failed]
        name:
          type: string
        mime:
          type: string
        size:
          type: integer
          format: int64
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        takenAt:
          type: [string, "null"]
          format: date-time
        sortAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        deletedAt:
          description: When the photo was moved to the trash
          type: [string, "null"]
          format: date-time
        camera:
          description: Shooting details from EXIF. Null when the photo has none
          oneOf:
            - $ref: "#/components/schemas/Camera"
            - type: "null"
        location:
          description: Where the photo was taken. Null when it has no location or an administrator hides locations
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
    Camera:
      description: Each field is present only when the photo has it
      type: object
      properties:
        make:
          type: string
        model:
          type: string
        lens:
          type: string
        focalLength:
          description: Millimetres
          type: number
        focalLength35mm:
          description: Millimetres, as on a 35 mm camera
          type: number
        fNumber:
          type: number
        exposureTime:
          description: Seconds
          type: number
        iso:
          type: number
        exposureCompensation:
          description: EV
          type: number
        flash:
          description: Whether the flash fired
          type: boolean
    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          description: Degrees, negative to the south
          type: number
        longitude:
          description: Degrees, negative to the west
          type: number
    CameraLists:
      type: object
      required: [cameras, lenses]
      properties:
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/NameCount"
        lenses:
          type: array
          items:
            $ref: "#/components/schemas/NameCount"
    NameCount:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
          format: int64
    MonthCounts:
      description: The number of photos a list has in each month, newest first. Months without photos are left out
      type: array
      items:
        type: object
        required: [month, count]
        properties:
          month:
            description: The month in the requested time zone, such as `2024-05`
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
          count:
            type: integer
            format: int64
    PhotoPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        nextCursor:
          type: [string, "null"]
    PhotoIds:
      type: array
      minItems: 1
      maxItems: 500
      items:
        type: integer
        format: int64
    UploadResult:
      type: object
      required: [photo, duplicate, restored]
      properties:
        photo:
          $ref: "#/components/schemas/Photo"
        duplicate:
          type: boolean
        restored:
          description: The user had this photo in the trash, and it has been restored
          type: boolean
    Album:
      type: object
      required: [id, ownerId, name, shared, photoCount, coverPhotoId, coverChosen, createdAt]
      properties:
        id:
          type: integer
          format: int64
        ownerId:
          type: integer
          format: int64
        name:
          type: string
        shared:
          description: Whether anyone but the owner has been given access to the album
          type: boolean
        photoCount:
          description: Photos of the album outside the trash
          type: integer
          format: int64
        coverPhotoId:
          description: The chosen cover, or else the newest processed photo
          type: [integer, "null"]
          format: int64
        coverChosen:
          type: boolean
        createdAt:
          type: string
          format: date-time
    TagRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Tag:
      type: object
      required: [id, name, photoCount]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        photoCount:
          description: Photos with this tag outside the trash
          type: integer
          format: int64
    PhotoEvent:
      type: object
      required: [pending, failed, photos]
      properties:
        pending:
          type: integer
        failed:
          type: integer
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
