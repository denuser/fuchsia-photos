openapi: 3.1.0
info:
  title: Fuchsia Photos API
  version: 0.3.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the application can serve requests
      security: []
      responses:
        "200":
          description: The application and its database are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /login:
    post:
      operationId: login
      summary: Start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Logged in. The session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
  /logout:
    post:
      operationId: logout
      summary: End the session
      security: []
      responses:
        "204":
          description: Logged out
  /me:
    get:
      operationId: getMe
      summary: Get the current user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
  /me/password:
    post:
      operationId: changePassword
      summary: Change the current user's password and end their other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        "204":
          description: The password is changed
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: List users (administrators only)
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create a user (administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password, role]
              properties:
                login:
                  type: string
                password:
                  type: string
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "201":
          description: The new user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /users/{id}:
    patch:
      operationId: updateUser
      summary: Change a user (administrators only)
      description: Resetting a password or disabling a user ends their sessions. Administrators cannot change their own role or disable themselves.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/Role"
                disabled:
                  type: boolean
                password:
                  type: string
      responses:
        "200":
          description: The changed user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /photos:
    get:
      operationId: listPhotos
      summary: List the current user's photos, newest first
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: cursor
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: Only photos sorted at or after this time
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only photos sorted before this time
          schema:
            type: string
            format: date-time
        - name: tag
          in: query
          description: Only photos with at least one of these tags
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: album
          in: query
          description: Only photos of this album
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: One page of photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoPage"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: uploadPhoto
      summary: Upload a photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The user already had this photo, and nothing was added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "201":
          description: The photo was added and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /photos/trash:
    get:
      operationId: listTrash
      summary: List the current user's photos in the trash, most recently deleted first
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: One page of photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoPage"
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: trashPhotos
      summary: Move photos to the trash
      description: Photos stay in the trash until the owner restores or purges them. Photos of other users are ignored.
      requestBody:
        $ref: "#/components/requestBodies/PhotoIds"
      responses:
        "204":
          description: The photos are in the trash
        "400":
          $ref: "#/components/responses/Error"
  /photos/trash/empty:
    post:
      operationId: emptyTrash
      summary: Permanently delete every photo in the current user's trash
      responses:
        "204":
          description: The trash is empty
  /photos/restore:
    post:
      operationId: restorePhotos
      summary: Take photos out of the trash
      requestBody:
        $ref: "#/components/requestBodies/PhotoIds"
      responses:
        "204":
          description: The photos are restored
        "400":
          $ref: "#/components/responses/Error"
  /photos/purge:
    post:
      operationId: purgePhotos
      summary: Permanently delete photos from the trash, with their files
      description: Photos outside the trash and photos of other users are ignored.
      requestBody:
        $ref: "#/components/requestBodies/PhotoIds"
      responses:
        "204":
          description: The photos are deleted
        "400":
          $ref: "#/components/responses/Error"
  /photos/tags:
    post:
      operationId: changePhotoTags
      summary: Add tags to photos and remove tags from them
      description: Photos and tags of other users are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  $ref: "#/components/schemas/PhotoIds"
                add:
                  type: array
                  items:
                    type: integer
                    format: int64
                remove:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "204":
          description: The tags are changed
        "400":
          $ref: "#/components/responses/Error"
  /photos/events:
    get:
      operationId: photoEvents
      summary: Stream changes to the current user's photos
      description: Server-sent events named `photos`, each holding a PhotoEvent as JSON. Changed photos include those moved to the trash, which have `deletedAt` set.
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/PhotoEvent"
  /photos/{id}:
    get:
      operationId: getPhoto
      summary: Get a photo the current user may see
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "404":
          $ref: "#/components/responses/Error"
  /photos/{id}/tags:
    get:
      operationId: getPhotoTags
      summary: List the current user's own tags on a photo
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagRef"
        "404":
          $ref: "#/components/responses/Error"
  /photos/{id}/previews/{kind}:
    get:
      operationId: getPreview
      summary: Get a preview without metadata
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [grid, viewer]
      responses:
        "200":
          description: The preview image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /photos/{id}/original:
    get:
      operationId: getOriginal
      summary: Download the original file
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The original file
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /albums:
    get:
      operationId: listAlbums
      summary: List the current user's albums
      responses:
        "200":
          description: The albums, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Album"
    post:
      operationId: createAlbum
      summary: Create an album
      requestBody:
        $ref: "#/components/requestBodies/Name"
      responses:
        "201":
          description: The new album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "400":
          $ref: "#/components/responses/Error"
  /albums/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAlbum
      summary: Get an album
      responses:
        "200":
          description: The album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: renameAlbum
      summary: Rename an album
      requestBody:
        $ref: "#/components/requestBodies/Name"
      responses:
        "200":
          description: The changed album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAlbum
      summary: Delete an album and keep its photos
      responses:
        "204":
          description: The album is deleted
        "404":
          $ref: "#/components/responses/Error"
  /albums/{id}/cover:
    put:
      operationId: setAlbumCover
      summary: Choose the cover of an album
      description: The photo must be in the album and not in the trash. With null, the newest photo becomes the cover again.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoId]
              properties:
                photoId:
                  type: [integer, "null"]
                  format: int64
      responses:
        "200":
          description: The changed album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "404":
          $ref: "#/components/responses/Error"
  /albums/{id}/photos:
    post:
      operationId: addAlbumPhotos
      summary: Add photos to an album
      description: Photos of other users and photos in the trash are ignored.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/PhotoIds"
      responses:
        "204":
          description: The photos are in the album
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /albums/{id}/photos/remove:
    post:
      operationId: removeAlbumPhotos
      summary: Remove photos from an album and keep them in the library
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/PhotoIds"
      responses:
        "204":
          description: The photos are out of the album
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /tags:
    get:
      operationId: listTags
      summary: List the current user's tags
      responses:
        "200":
          description: The tags, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
    post:
      operationId: createTag
      summary: Create a tag, or find the existing one with this name
      description: Names are compared without regard to case.
      requestBody:
        $ref: "#/components/requestBodies/Name"
      responses:
        "200":
          description: The user already had this tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRef"
        "201":
          description: The new tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRef"
        "400":
          $ref: "#/components/responses/Error"
  /tags/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: renameTag
      summary: Rename a tag
      requestBody:
        $ref: "#/components/requestBodies/Name"
      responses:
        "200":
          description: The changed tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagRef"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTag
      summary: Delete a tag and keep its photos
      responses:
        "204":
          description: The tag is deleted
        "404":
          $ref: "#/components/responses/Error"
security:
  - session: []
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fuchsia_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBodies:
    PhotoIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids:
                $ref: "#/components/schemas/PhotoIds"
    Name:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
  responses:
    Error:
      description: The request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Role:
      type: string
      enum: [admin, user]
    User:
      type: object
      required: [id, login, role, disabled, createdAt]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Photo:
      type: object
      required: [id, ownerId, status, name, mime, size, width, height, takenAt, sortAt, createdAt, deletedAt]
      properties:
        id:
          type: integer
          format: int64
        ownerId:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, ready, failed]
        name:
          type: string
        mime:
          type: string
        size:
          type: integer
          format: int64
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        takenAt:
          type: [string, "null"]
          format: date-time
        sortAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        deletedAt:
          description: When the photo was moved to the trash
          type: [string, "null"]
          format: date-time
    PhotoPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        nextCursor:
          type: [string, "null"]
    PhotoIds:
      type: array
      minItems: 1
      maxItems: 500
      items:
        type: integer
        format: int64
    UploadResult:
      type: object
      required: [photo, duplicate, restored]
      properties:
        photo:
          $ref: "#/components/schemas/Photo"
        duplicate:
          type: boolean
        restored:
          description: The user had this photo in the trash, and it has been restored
          type: boolean
    Album:
      type: object
      required: [id, name, photoCount, coverPhotoId, coverChosen, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        photoCount:
          description: Photos of the album outside the trash
          type: integer
          format: int64
        coverPhotoId:
          description: The chosen cover, or else the newest processed photo
          type: [integer, "null"]
          format: int64
        coverChosen:
          type: boolean
        createdAt:
          type: string
          format: date-time
    TagRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Tag:
      type: object
      required: [id, name, photoCount]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        photoCount:
          description: Photos with this tag outside the trash
          type: integer
          format: int64
    PhotoEvent:
      type: object
      required: [pending, failed, photos]
      properties:
        pending:
          type: integer
        failed:
          type: integer
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
